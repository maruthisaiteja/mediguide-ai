[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediguide-vision-ai"
version = "2.0.0"
description = "Multiagent Medical Image Analysis and Healthcare Navigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

[tool.vercel]
entrypoint = "api/index.py"
